<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChargeSpot – EV Charging Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12263A;--mute:#6B7A8A;--line:#E3E9EE;--bg:#F5F8FA;--card:#fff;--brand:#0B8F7B;--brand-d:#08705F;--free:#0B8F7B;--busy:#E0A030;--down:#D64545;--page:#DCE5EA}
@media (prefers-color-scheme:dark){:root[data-auto]{--page:#0c1218}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--page);display:flex;align-items:center;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #7fd4c6;outline-offset:2px}
.phone{width:390px;height:790px;max-height:100vh;background:var(--bg);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(18,38,58,.25);border:8px solid #12263A}
@media (max-width:440px){.phone{width:100%;height:100%;border:0;border-radius:0}}
.screen{flex:1;overflow-y:auto;padding:18px 18px 12px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.logo{font-weight:800;font-size:20px;letter-spacing:-.3px}
.logo i{font-style:normal;color:var(--brand)}
h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.chip{padding:8px 14px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.map{background:#E9F1F0;border-radius:18px;height:200px;position:relative;overflow:hidden;margin-bottom:14px;border:1px solid var(--line)}
.map svg{width:100%;height:100%;display:block}
.pin{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;border:3px solid #fff;color:#fff;font-size:11px;font-weight:700;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.free{background:var(--free)}.busy{background:var(--busy)}.down{background:var(--down)}
.me{position:absolute;width:14px;height:14px;margin:-7px;border-radius:50%;background:#2F6FE4;border:3px solid #fff;box-shadow:0 0 0 6px rgba(47,111,228,.2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.card .grow{flex:1}
.card b{font-size:15px}
.meta{font-size:12px;color:var(--mute);margin-top:3px}
.tag{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.btn{display:block;width:100%;padding:15px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;font-size:15px;margin-top:14px}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{background:#B8C4CC;cursor:not-allowed}
.back{font-size:14px;font-weight:600;color:var(--mute);margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat span{display:block;font-size:12px;color:var(--mute)}
.stat b{font-size:17px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.slot{padding:11px 0;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px}
.slot.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.slot:disabled{color:#B0BBC4;text-decoration:line-through;cursor:not-allowed}
label{font-size:13px;font-weight:700;display:block;margin:14px 0 6px}
select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font:inherit}
input[type=range]{width:100%;accent-color:var(--brand)}
.ok{text-align:center;padding-top:36px}
.tick{width:72px;height:72px;border-radius:50%;background:var(--brand);color:#fff;font-size:36px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.code{font-size:26px;font-weight:800;letter-spacing:3px;background:var(--card);border:2px dashed var(--brand);border-radius:14px;padding:14px;margin:18px 0 6px}
.route{border-left:3px solid var(--brand);margin:14px 0 0 8px;padding-left:16px}
.route div{margin-bottom:16px;position:relative}
.route div:before{content:"";position:absolute;left:-24px;top:3px;width:11px;height:11px;border-radius:50%;background:var(--card);border:3px solid var(--brand)}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.bar em{font-style:normal;width:96px}
.bar span{height:12px;border-radius:6px;background:var(--brand)}
.bar span.hot{background:var(--down)}
.nav{display:flex;border-top:1px solid var(--line);background:var(--card);padding:6px 4px 10px}
.nav button{flex:1;padding:8px 0;font-size:12px;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--brand)}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.empty{color:var(--mute);text-align:center;padding:40px 10px;font-size:14px}
.note{font-size:11px;color:var(--mute);text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="phone" id="app">
  <div class="screen" id="screen"></div>
  <nav class="nav" id="nav"></nav>
</div>

<script>
const S=[
 {id:1,name:"GreenPlug Hub",area:"Koramangala",x:30,y:35,st:"free",kw:50,price:18,conn:["CCS2"],wait:0,taken:[1]},
 {id:2,name:"VoltPoint Mall",area:"Indiranagar",x:62,y:25,st:"busy",kw:30,price:16,conn:["CCS2","Type 2"],wait:25,taken:[0,1,2,3]},
 {id:3,name:"SunCharge Park",area:"HSR Layout",x:42,y:70,st:"free",kw:22,price:12,conn:["Type 2"],wait:0,taken:[2]},
 {id:4,name:"MetroCharge Station",area:"Whitefield",x:85,y:50,st:"down",kw:60,price:20,conn:["CCS2"],wait:0,taken:[]},
 {id:5,name:"EcoBay Fast",area:"Electronic City",x:20,y:82,st:"free",kw:120,price:22,conn:["CCS2"],wait:5,taken:[3,4]}
];
const T=["9:00","10:00","11:00","12:00","1:00","2:00"];
const label={free:"Available",busy:"Busy",down:"Out of order"};
let tab="find",filter="All",view="list",cur=null,slot=null,bookings=[];
const $=id=>document.getElementById(id);
const icons={find:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',trip:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',book:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/>',insights:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'};
const names={find:"Find",trip:"Trip",book:"Bookings",insights:"Insights"};

function nav(){$("nav").innerHTML=Object.keys(names).map(k=>`<button class="${tab===k?'on':''}" onclick="go('${k}')" aria-label="${names[k]}"><svg viewBox="0 0 24 24">${icons[k]}</svg>${names[k]}</button>`).join("")}
function go(t){tab=t;view="list";cur=null;slot=null;render()}
function list(){return S.filter(s=>filter==="All"||(filter==="Available now"?s.st==="free":s.conn.includes(filter)))}

function find(){
 const L=list();
 let h=`<div class="top"><div class="logo">Charge<i>Spot</i></div></div><h2>Find a charger</h2><p class="sub">Showing stations near you in Bengaluru</p>
 <div class="chips">${["All","CCS2","Type 2","Available now"].map(f=>`<button class="chip ${filter===f?'on':''}" onclick="filter='${f}';render()">${f}</button>`).join("")}</div>
 <div class="map"><svg viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M0 40 Q30 20 60 35 T100 20" stroke="#fff" stroke-width="3" fill="none"/><path d="M20 0 Q35 30 30 60" stroke="#fff" stroke-width="3" fill="none"/><path d="M0 12 L100 48" stroke="#fff" stroke-width="2" fill="none"/><path d="M70 0 Q60 30 80 60" stroke="#fff" stroke-width="2" fill="none"/></svg>
 <div class="me" style="left:48%;top:48%"></div>
 ${L.map(s=>`<button class="pin ${s.st}" style="left:${s.x}%;top:${s.y*0.95+2}%" onclick="open_(${s.id})" aria-label="${s.name}">${s.kw}</button>`).join("")}</div>`;
 if(!L.length)h+=`<p class="empty">No chargers match this filter. Try “All”.</p>`;
 h+=L.map(s=>`<button class="card" onclick="open_(${s.id})"><div class="grow"><b>${s.name}</b><div class="meta">${s.area} · ${s.kw} kW · ₹${s.price}/kWh · ${s.conn.join(", ")}</div></div><span class="tag ${s.st}">${label[s.st]}</span></button>`).join("");
 h+=`<p class="note">Sample data for prototype demonstration</p>`;
 return h}

function detail(){
 const s=cur;
 return `<button class="back" onclick="view='list';render()">‹ Back</button><h2>${s.name}</h2><p class="sub">${s.area}, Bengaluru</p><span class="tag ${s.st}">${label[s.st]}</span>
 <div class="grid"><div class="stat"><span>Speed</span><b>${s.kw} kW</b></div><div class="stat"><span>Price</span><b>₹${s.price}/kWh</b></div><div class="stat"><span>Connectors</span><b>${s.conn.join(", ")}</b></div><div class="stat"><span>Wait time</span><b>${s.st==="down"?"–":s.wait?s.wait+" min":"None"}</b></div></div>
 ${s.st==="down"?`<p class="empty">This charger is out of order. Pick another station.</p><button class="btn ghost" onclick="view='list';render()">See other chargers</button>`:
 `<label>Choose a time today</label><div class="slots">${T.map((t,i)=>`<button class="slot ${slot===i?'on':''}" ${s.taken.includes(i)?'disabled':''} onclick="slot=${i};render()">${t}</button>`).join("")}</div>
 <button class="btn" ${slot===null?'disabled':''} onclick="book()">Book slot</button><button class="btn ghost" onclick="alert('Thanks. Operator and nearby users are notified.')">Report a problem</button>`}`}

function book(){
 const c="CS-"+Math.floor(1000+Math.random()*9000);
 bookings.push({s:cur,t:T[slot],c});
 cur.taken.push(slot);view="done";render()}
function done(){const b=bookings[bookings.length-1];
 return `<div class="ok"><div class="tick">✓</div><h2>Slot booked</h2><p class="sub">${b.s.name}, ${b.t} today</p><div class="code">${b.c}</div><p class="sub">Show this code at the charger</p><button class="btn" onclick="go('book')">View bookings</button><button class="btn ghost" onclick="go('find')">Back to map</button></div>`}

function bookingsV(){
 let h=`<div class="top"><div class="logo">Charge<i>Spot</i></div></div><h2>Your bookings</h2><p class="sub">Upcoming charging slots</p>`;
 if(!bookings.length)return h+`<p class="empty">No bookings yet. Find a charger and book a slot.</p><button class="btn" onclick="go('find')">Find a charger</button>`;
 return h+bookings.map(b=>`<div class="card"><div class="grow"><b>${b.s.name}</b><div class="meta">Today, ${b.t} · ${b.s.area}</div></div><span class="tag free">${b.c}</span></div>`).join("")}

const D={Mysuru:145,Hosur:40,Tumakuru:70,Chennai:345,Goa:560};
function trip(){
 return `<div class="top"><div class="logo">Charge<i>Spot</i></div></div><h2>Plan a trip</h2><p class="sub">We add charging stops along your route</p>
 <label for="dest">Destination from Bengaluru</label><select id="dest">${Object.keys(D).map(d=>`<option>${d}</option>`).join("")}</select>
 <label for="bat">Battery now: <span id="bv">80</span>%</label><input type="range" id="bat" min="10" max="100" value="80" oninput="$('bv').textContent=this.value">
 <button class="btn" onclick="plan()">Plan route</button><div id="res"></div>`}
function plan(){
 const d=D[$("dest").value],b=+$("bat").value,range=b*2.5*0.85,full=250*0.85;
 let stops=[],left=d,r=range,km=0;
 while(left>r){km+=r*0.9;left=d-km;stops.push(Math.round(km));r=full}
 let h=`<div class="route"><div><b>Bengaluru</b><div class="meta">Start · ${b}% battery</div></div>`;
 stops.forEach((k,i)=>{const s=S.filter(x=>x.st!=="down")[i%4];h+=`<div><b>Charge at ${s.name}</b><div class="meta">About ${k} km · ${s.kw} kW · 30 min stop</div></div>`});
 h+=`<div><b>${$("dest").value}</b><div class="meta">${d} km · ${stops.length?stops.length+" charging stop"+(stops.length>1?"s":""):"No stop needed"}</div></div></div>`;
 $("res").innerHTML=h}

function insights(){
 const a=[["Whitefield",92,1],["Electronic City",78,1],["Indiranagar",64,0],["Koramangala",55,0],["HSR Layout",31,0]];
 return `<div class="top"><div class="logo">Charge<i>Spot</i></div></div><h2>Demand insights</h2><p class="sub">For planners: where drivers need more chargers</p>
 ${a.map(r=>`<div class="bar"><em>${r[0]}</em><span class="${r[2]?'hot':''}" style="width:${r[1]*1.6}px"></span>${r[1]}</div>`).join("")}
 <div class="card" style="margin-top:14px"><div class="grow"><b>Install here next</b><div class="meta">Whitefield and Electronic City have high demand and few working chargers.</div></div></div>
 <div class="grid"><div class="stat"><span>Peak hours</span><b>6–9 pm</b></div><div class="stat"><span>Faulty chargers</span><b>1 of 5</b></div></div>
 <p class="note">Sample data for prototype demonstration</p>`}

function open_(id){cur=S.find(s=>s.id===id);slot=null;view="detail";render()}
function render(){
 $("screen").innerHTML=tab==="find"?(view==="detail"?detail():view==="done"?done():find()):tab==="trip"?trip():tab==="book"?bookingsV():insights();
 $("screen").scrollTop=0;nav()}
render();
</script>
</body>
</html>
